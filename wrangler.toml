name = "vpn-shop-bot"
main = "src/index.js"
compatibility_date = "2024-09-01"

# --- KV Namespaces ---
kv_namespaces = [
  { binding = "BOT_KV", id = "" },
  { binding = "BOT_SESSIONS", id = "" }
]

# --- Secrets (set with: npx wrangler secret put BOT_TOKEN) ---
# npx wrangler secret put WEBHOOK_SECRET
# npx wrangler secret put OWNER_ID

[vars]
BOT_NAME = ""
BOT_USERNAME = ""
PUBLIC_BASE_URL = ""
ZARINPAL_SANDBOX = "true"

# --- Cron triggers ---
[triggers]
crons = ["*/15 * * * *"]

# --- Durable Object for serialized wallet operations ---
[[durable_objects.bindings]]
name = "WALLET_LOCK"
class_name = "WalletLock"

# --- SQLite-backed Durable Object migration ---
[[migrations]]
tag = "v1"
new_sqlite_classes = ["WalletLock"]
